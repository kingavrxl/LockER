services:
  - type: web
    name: locker-backend-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./locker.db
      - key: FIREBASE_CREDENTIALS_PATH
        value: firebase-service-account.json
      - key: SUPPORT_PHONE_NUMBER
        value: "+2290191521518"
